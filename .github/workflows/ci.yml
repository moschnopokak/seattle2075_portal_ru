name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Запуск приложения (дымовая проверка)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Синтаксис
        run: python -m compileall -q app add-id.py

      - name: Заготовки конфигурации
        run: |
          cp config/players.example.toml config/players.toml
          cp config/campaign.example.json config/campaign.json

      - name: Запуск и проверка ответов
        env:
          DEV_LOGIN: "1"
          COOKIE_SECURE: "0"
          DATA_DIR: ${{ runner.temp }}/data
        run: |
          uvicorn app.main:app --port 8000 &
          for i in $(seq 1 20); do
            curl -fs -o /dev/null http://127.0.0.1:8000/ && break
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:8000/
          curl -fsS -o /dev/null http://127.0.0.1:8000/static/map/map.json
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/state)" = "401"

      - name: Служба systemd (проверка файла и оценка защищённости)
        run: |
          sed -e 's#/opt/seattle2075-portal/.venv/bin/uvicorn#/bin/true#' -e 's#^User=portal#User=root#' \
            deploy/seattle2075-portal.service > /tmp/portal.service
          systemd-analyze verify /tmp/portal.service
          systemd-analyze security --offline=true /tmp/portal.service | tail -1
          score=$(systemd-analyze security --offline=true /tmp/portal.service | sed -n 's/.*exposure level for .*: \([0-9.]*\).*/\1/p')
          echo "оценка экспозиции: $score"
          awk -v s="$score" 'BEGIN { exit !(s != "" && s + 0 < 5) }'

  tests:
    name: Автотесты
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Статический анализ
        run: python -m pyflakes app tests add-id.py

      - name: Тесты (без браузера)
        run: python -m pytest -m "not browser" -q

  ui:
    name: Проверки в браузере
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: python -m playwright install --with-deps chromium

      - name: Тесты в браузере
        run: python -m pytest -m browser -q

  docker:
    name: Сборка Docker-образа
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Сборка образа
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: seattle2075-portal:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Запуск усиленного контейнера и проверка
        run: |
          cp config/players.example.toml config/players.toml
          cp config/campaign.example.json config/campaign.json
          mkdir -p data && sudo chown 1000:1000 data
          docker run -d --name portal -p 8000:8000 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            --health-interval 3s --health-start-period 5s \
            -e DEV_LOGIN=1 -e COOKIE_SECURE=0 \
            -v "$PWD/data:/app/data" -v "$PWD/config:/app/config:ro" \
            seattle2075-portal:ci
          for i in $(seq 1 40); do
            status=$(docker inspect -f '{{.State.Health.Status}}' portal)
            [ "$status" = healthy ] && break
            sleep 2
          done
          echo "состояние контейнера: $status"
          test "$status" = healthy
          curl -fsS -o /dev/null http://127.0.0.1:8000/
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/state)" = "401"
          curl -fsS -D - -o /dev/null http://127.0.0.1:8000/ | grep -i "frame-ancestors"
          curl -fsS http://127.0.0.1:8000/healthz | grep -F "${{ github.sha }}"
          # в усиленном контейнере база и копии по-прежнему пишутся в data/
          docker exec portal python -m app.backup
          docker exec portal python -m app.backup --verify

      - name: Проверка конфигурации Caddy
        run: |
          docker run --rm -e DOMAIN=portal.example.ru -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2 caddy validate --config /etc/caddy/Caddyfile

      - name: Проверка конфигурации nginx
        run: |
          printf 'events {}\nhttp {\n  include /etc/nginx/conf.d/*.conf;\n}\n' > /tmp/nginx-test.conf
          docker run --rm -v /tmp/nginx-test.conf:/etc/nginx/nginx.conf:ro \
            -v "$PWD/deploy/nginx-portal.conf:/etc/nginx/conf.d/portal.conf:ro" nginx:stable nginx -t

      - name: Проверка compose-файла
        run: |
          printf 'DOMAIN=portal.example.ru\n' > .env
          docker compose config -q
          docker compose -f docker-compose.ghcr.yml config -q

      - name: Журнал контейнера при сбое
        if: failure()
        run: docker logs portal

  publish:
    name: Публикация образа в GitHub Container Registry
    # Только для основной ветки и тегов версий (v1.2.3), когда всё остальное зелёное
    needs: [smoke, tests, ui, docker]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
