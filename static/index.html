  }
  gj(MAPDATA.water,{pane:'water',interactive:true,bubblingMouseEvents:true,style:{className:'m-water m-coast',weight:.8,fillOpacity:1}}).addTo(MAP);
  const grid=[];for(let x=5000;x<W;x+=5000)grid.push([LL(x,0),LL(x,H)]);for(let y=5000;y<H;y+=5000)grid.push([LL(0,y),LL(W,y)]);
  MAPL.grid=L.layerGroup([L.polyline(grid,{pane:'grid',className:'m-grid',weight:1,interactive:false})]);
  const lbl=(x,y,cls,html)=>L.marker(LL(x,y),{pane:'labels',interactive:false,keyboard:false,icon:L.divIcon({className:'ml '+cls,html:`<span>${html}</span>`,iconSize:[0,0]})});
  for(let i=0;i*5000<W;i++)MAPL.grid.addLayer(lbl(i*5000+2500,700,'ml-g',GRID_COLS[i]));
  for(let j=0;j*5000<H;j++)MAPL.grid.addLayer(lbl(700,j*5000+2500,'ml-g',j+1));
  MAPL.roads=L.layerGroup([['primary','m-rp',.9],['trunk','m-rt',1.5],['motorway','m-rm',2.3]].map(([k,c,w])=>gj(MAPDATA.roads[k],{pane:'roads',interactive:false,style:{className:c,weight:w,fill:false}})));
  (MAPDATA.shields||[]).forEach(r=>MAPL.roads.addLayer(lbl(r.x,r.y,'ml-r ml-r-'+r.kind,esc(r.ref))));
  L.control.attribution({prefix:false,position:'bottomright'}).addAttribution('Дороги: © участники <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>').addTo(MAP);
  gj(MAPDATA.borders.inner,{pane:'borders',interactive:false,style:{className:'m-border',weight:1.3,fill:false}}).addTo(MAP);
  gj(MAPDATA.borders.metro,{pane:'borders',interactive:false,style:{className:'m-metro',weight:2,dashArray:'7 4',fill:false}}).addTo(MAP);
  gj(MAPDATA.borders.wall,{pane:'borders',interactive:false,style:{className:'m-wall',weight:2.6,fill:false}}).addTo(MAP);
  const labels=L.layerGroup().addTo(MAP);
  MAPDATA.labels.forEach(l=>labels.addLayer(lbl(l.xy[0],l.xy[1],'ml-d'+(l.big?' big':'')+(l.slug==='dogtown'?' ml-dog':''),esc(l.name))));
  MAPDATA.water_labels.forEach(l=>labels.addLayer(lbl(l.xy[0],l.xy[1],'ml-w s'+l.size,esc(l.name))));
  MAPDATA.zone_labels.forEach(l=>labels.addLayer(lbl(l.xy[0],l.xy[1],'ml-o',esc(l.name))));
  MAPL.places=L.layerGroup();
  for(const k of Object.keys(MAPLAYERS))if(MAPLAYERS[k])MAP.addLayer(MAPL[k]);
  const svg=MAP.getPane('dist').querySelector('svg');
  if(svg&&!svg.querySelector('#dogwall'))svg.insertAdjacentHTML('afterbegin','<defs><pattern id="dogwall" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="9" class="dog-bg"/><rect width="3" height="9" class="dog-hatch"/></pattern></defs>');
  MAP.on('zoomend',setZoomClass);
  MAP.on('zoomend moveend',()=>requestAnimationFrame(declutter));
  MAP.on('click',e=>{if(ADDING)mapAddAt(e.latlng);});
  const hud=document.getElementById('map-hud');
  const hudAt=ll=>{if(!hud)return;const x=ll.lng,y=-ll.lat;hud.textContent=(x<0||y<0||x>MAPDATA.W||y>MAPDATA.H)?'За краем карты':'Квадрат '+square(x,y);};
  MAP.on('mousemove',e=>hudAt(e.latlng));MAP.on('moveend',()=>hudAt(MAP.getCenter()));
  const home=L.latLngBounds(LL(24000,6000),LL(62000,132000));
  if(UI.mapView)MAP.setView(UI.mapView.c,UI.mapView.z);else MAP.fitBounds(home);
  MAP.on('moveend',()=>{UI.mapView={c:MAP.getCenter(),z:MAP.getZoom()};});
  setZoomClass();updateMapTools();refreshPlaces();hudAt(MAP.getCenter());requestAnimationFrame(declutter);
  if(UI.focusPlace){const p=placeById(UI.focusPlace);UI.focusPlace=null;if(p){focusPlace(p);openPlace(p.id);}}

function refreshPlaces(){

  MAPL.places.clearLayers();PMARK={};
  for(const p of placesVisible()){
    const n=S.entries.filter(e=>e.place===p.id&&canSee(e)&&isActive(e)).length;
    const cls='pl pl-'+p.type+(p.vis==='мастер'?' pl-hidden':'')+(p.vis==='знают'?' pl-known':'');
    const m=L.marker(LL(p.x,p.y),{title:p.name,riseOnHover:true,icon:L.divIcon({className:cls,iconSize:[0,0],
      html:`<span class="pl-ico"><svg viewBox="0 0 20 20" aria-hidden="true">${PLACE_GLYPH[p.type]||PLACE_GLYPH.other}</svg>${n?`<b class="pl-n">${n}</b>`:''}</span><span class="pl-name">${esc(p.name)}</span>`})});
    m.on('click',()=>{if(MOVING===p.id){stopMoving('Перемещение отменено');return;}if(!ADDING&&!MOVING)openPlace(p.id);});
    m.on('dragend',async()=>{const q=m.getLatLng();const it=placeById(p.id);MOVING=null;PENDING_PLACES=false;
      const j=await apiPost('/api/gm/items/places',Object.assign({},it,{x:Math.round(q.lng),y:Math.round(-q.lat)}));
      refreshPlaces();if(j)toast('Место перемещено');});
    MAPL.places.addLayer(m);PMARK[p.id]=m;
  }
}

function openCropper(cardId,file){
  const c=(S.dossier||[]).find(x=>x.id===cardId);if(!c)return;
  if(file.size>40*1048576){toast('Файл слишком большой. Возьмите картинку поменьше.');return;}

    startCrop(c,im);
  };
  im.onerror=()=>{URL.revokeObjectURL(url);toast('Не удалось открыть картинку. Подойдут JPEG, PNG и WebP.');};

function startCrop(c,im){
  curKey=null;
  showPanel(`<p class="kind">${esc(c.name)}</p><h2>Картинка</h2>
  <p class="note" style="margin:0 0 12px">Перетащите картинку и подберите масштаб. Сохранится квадрат, картинка сожмётся до небольшого размера.</p>
  <div class="crop ${c.type}" id="crop"><canvas id="crop-cv"></canvas></div>
  <label class="field" style="margin-top:12px">Масштаб<input type="range" id="crop-zoom" min="1" max="4" step="0.01" value="1"></label>
  <p class="err" id="form-err" role="alert"></p>
  <div class="acts"><button type="button" class="btn primary" id="crop-save">Сохранить</button><button type="button" class="btn" id="crop-cancel">Отмена</button></div>`);
  const box=document.getElementById('crop'),cv=document.getElementById('crop-cv'),zoom=document.getElementById('crop-zoom'),err=document.getElementById('form-err');
  const iw=im.naturalWidth,ih=im.naturalHeight,side=box.clientWidth,dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=cv.height=Math.round(side*dpr);
  const ctx=cv.getContext('2d');ctx.imageSmoothingQuality='high';
  const minS=side/Math.min(iw,ih);let z=1,cx=iw/2,cy=ih>iw?side/(2*minS)+(ih-side/minS)*0.2:ih/2;
  const clamp=()=>{const half=side/(2*minS*z);cx=Math.min(Math.max(cx,half),iw-half);cy=Math.min(Math.max(cy,half),ih-half);};
  const rect=()=>{clamp();const w=side/(minS*z);return [cx-w/2,cy-w/2,w];};
  const draw=()=>{const [sx,sy,w]=rect();ctx.clearRect(0,0,cv.width,cv.height);ctx.drawImage(im,sx,sy,w,w,0,0,cv.width,cv.height);};
  draw();
  let drag=null;
  box.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];box.setPointerCapture(e.pointerId);box.classList.add('grab');});
  box.addEventListener('pointermove',e=>{if(!drag)return;const s=minS*z;cx-=(e.clientX-drag[0])/s;cy-=(e.clientY-drag[1])/s;drag=[e.clientX,e.clientY];draw();});
  const end=()=>{drag=null;box.classList.remove('grab');};
  box.addEventListener('pointerup',end);box.addEventListener('pointercancel',end);
  box.addEventListener('wheel',e=>{e.preventDefault();z=Math.min(4,Math.max(1,z*Math.exp(-e.deltaY*0.0015)));zoom.value=z;draw();},{passive:false});
  zoom.addEventListener('input',()=>{z=+zoom.value;draw();});
  document.getElementById('crop-cancel').onclick=()=>openDossier(c.id);
  document.getElementById('crop-save').onclick=async ev=>{
    const btn=ev.currentTarget;btn.disabled=true;btn.textContent='Загружается…';err.textContent='';
    const [sx,sy,w]=rect();
    const out=document.createElement('canvas');out.width=out.height=512;
    const o=out.getContext('2d');o.imageSmoothingQuality='high';o.drawImage(im,sx,sy,w,w,0,0,512,512);
    let blob=await new Promise(r=>out.toBlob(r,'image/webp',0.9));
    if(!blob||blob.type!=='image/webp')blob=await new Promise(r=>out.toBlob(r,'image/jpeg',0.9));
    const reset=()=>{btn.disabled=false;btn.textContent='Сохранить';};
    if(!blob){err.textContent='Не удалось подготовить картинку.';reset();return;}
    const j=await uploadPortrait(c.id,blob,m=>{err.textContent=m;});
    reset();
    if(j){render(true);openDossier(c.id);toast(j.msg);}
  };
}
async function uploadPortrait(cardId,blob,onError){
  if(RO()){toast('Предпросмотр: действия отключены');return null;}
  if(busy)return null;busy=true;
  try{
    const r=await fetch(`/api/gm/dossier/${encodeURIComponent(cardId)}/portrait`,{method:'POST',credentials:'same-origin',headers:{'Content-Type':blob.type||'application/octet-stream',...authHeaders()},body:blob});
    let j=null;try{j=await r.json();}catch(e){}
    if(r.status===401){showLogin();return null;}
    if(!r.ok){onError(r.status===413&&!j?'Файл слишком большой для сервера. Уменьшите картинку.':errText(j));return null;}
    if(j&&j.state)applyState(j.state);
    return j;
  }catch(e){onError('Нет связи с сервером. Попробуйте ещё раз.');return null;}
  finally{busy=false;}
}

async function submitHandout(form){
  const F=n=>form.elements.namedItem(n),err=m=>{document.getElementById('form-err').textContent=m;};
  const file=F('file').files[0],id=form.dataset.id;
  const old=id?(S.handouts||[]).find(x=>x.id===id):null;
  if(!id&&!file)return err('Выберите HTML-файл раздатки.');
  const vis=form.querySelector('input[name="vis"]:checked').value;
  const b={id:id||undefined,title:F('title').value.trim(),date:F('date').value,vis,known:[...form.querySelectorAll('input[name="known"]:checked')].map(x=>x.value),
    note:F('note').value.trim(),gm_note:F('gm_note').value.trim(),place:F('place').value};
  if(!b.title)return err('Укажите название раздатки.');
  const btn=form.querySelector('button[type="submit"]');btn.disabled=true;
  try{
    // новая раздатка сначала сохраняется черновиком: так игроки не получат уведомление раньше, чем загрузится файл
    const meta=file&&!(old&&old.file)?Object.assign({},b,{vis:'мастер',known:[]}):b;
    const before=new Set((S.handouts||[]).map(x=>x.id));
    const j=await apiPost('/api/gm/items/handouts',meta,err);if(!j)return;
    const hid=id||((S.handouts||[]).find(x=>!before.has(x.id))||{}).id;
    if(!hid)return err('Не удалось сохранить раздатку.');
    form.dataset.id=hid;
    if(file){
      btn.textContent='Загружается…';
      const up=await uploadHandout(hid,file,err);if(!up)return;
      if(meta!==b){const cur=(S.handouts||[]).find(x=>x.id===hid);const k=await apiPost('/api/gm/items/handouts',Object.assign({},cur,{vis:b.vis,known:b.known}),err);if(!k)return;}
    }
    closePanel();render(true);toast(b.vis==='мастер'?'Раздатка сохранена черновиком':(old&&old.file&&old.vis!=='мастер'?'Раздатка сохранена':'Раздатка выдана'));
  }finally{btn.disabled=false;btn.textContent=id?'Сохранить':'Добавить';}
}
async function uploadHandout(hid,file,onError){
  if(RO()){toast('Предпросмотр: действия отключены');return null;}
  if(busy)return null;busy=true;
  try{
    const r=await fetch(`/api/gm/handouts/${encodeURIComponent(hid)}/file`,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'text/html','X-File-Name':encodeURIComponent(file.name),...authHeaders()},body:file});
    let j=null;try{j=await r.json();}catch(e){}
    if(r.status===401){showLogin();return null;}
    if(!r.ok){onError(r.status===413&&!j?'Файл слишком большой для сервера.':errText(j));return null;}
    if(j&&j.state)applyState(j.state);
    return j;
  }catch(e){onError('Нет связи с сервером. Попробуйте ещё раз.');return null;}
  finally{busy=false;}
}

}
/* Данные запуска Mini App. Telegram кладёт их прямо в адрес страницы (#tgWebAppData=…),
   поэтому вход изнутри Telegram не зависит от загрузки скриптов с telegram.org. */
let LAUNCH={data:'',theme:''};
function launchParams(){
  const p=new URLSearchParams((location.hash||'').replace(/^#/,''));
  let data=p.get('tgWebAppData')||'',theme=p.get('tgWebAppThemeParams')||'';
  try{
    if(data){sessionStorage.setItem('seattle2075-initdata',data);if(theme)sessionStorage.setItem('seattle2075-theme',theme);}
    else{data=sessionStorage.getItem('seattle2075-initdata')||'';theme=sessionStorage.getItem('seattle2075-theme')||'';}
  }catch(e){}
  const tg=window.Telegram&&window.Telegram.WebApp;
  if(!data&&tg&&tg.initData)data=tg.initData;
  return {data,theme};
}
function themeFrom(json){
  try{const bg=JSON.parse(json).bg_color;if(!bg)return null;const n=parseInt(bg.slice(1),16);
    return (0.2126*(n>>16&255)+0.7152*(n>>8&255)+0.0722*(n&255))/255<0.5?'dark':'light';}catch(e){return null;}
}
function tgReady(){const tg=window.Telegram&&window.Telegram.WebApp;if(tg&&tg.initData){try{tg.ready();tg.expand&&tg.expand();}catch(e){}}}
async function webappLogin(){
  if(!LAUNCH.data)return false;
  try{
    const r=await fetch('/api/auth/webapp',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({init_data:LAUNCH.data})});
    if(!r.ok)return false;
    setToken((await r.json()).token);return true;
  }catch(e){return false;}
}
const getState=()=>fetch('/api/state',{headers:authHeaders(),credentials:'same-origin'});
async function boot(){
  try{CFG=await (await fetch('/api/config')).json();}catch(e){CFG={};}
  LAUNCH=launchParams();
  if(LAUNCH.data){
    const th=themeFrom(LAUNCH.theme);if(th)document.documentElement.dataset.theme=th;
    tgReady();window.addEventListener('load',tgReady);
    if(!TOKEN)await webappLogin();
  }
  let r=await getState();
  if(r.status===401&&LAUNCH.data&&await webappLogin())r=await getState();
  if(r.status===401){setToken(null);return showLogin();}
  if(r.status===403){let j=null;try{j=await r.json();}catch(e){}return showLogin((j&&j.detail)||{tg_id:'?'});}
  if(!r.ok){document.getElementById('main').innerHTML='<p class="err" style="padding-top:40px">Сервер не отвечает. Обновите страницу через минуту.</p>';return;}
  applyState(await r.json());
  document.getElementById('app-top').hidden=false;
  const want=new URLSearchParams(location.search).get('open');
  if(want){if(SECTIONS.some(x=>x.id===want&&(!x.gm||S.me.gm)))UI.section=want;try{history.replaceState(null,'',location.pathname+location.hash);}catch(e){}}
  render();
}
boot();

document.addEventListener('input',ev=>{if(ev.target.id==='hq'){UI.hq=ev.target.value;const f=document.getElementById('hq'),pos=f.selectionStart;render(true);const n=document.getElementById('hq');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}return;}if(ev.target.id==='dq'){UI.dq=ev.target.value;const l=document.getElementById('dlist');if(l)l.innerHTML=dList();}});

</script>
