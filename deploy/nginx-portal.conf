# Вариант без Docker. Замените portal.example.ru на свой домен,
# затем выполните: sudo certbot --nginx -d portal.example.ru
server {
    listen 80;
    server_name portal.example.ru;
    client_max_body_size 16m;  # загрузка картинок в досье и раздаток

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
