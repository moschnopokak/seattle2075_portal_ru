# Вариант без Docker. Замените portal.example.ru на свой домен,
# затем выполните: sudo certbot --nginx -d portal.example.ru
server {
    listen 80;
    server_name portal.example.ru;
    server_tokens off;
    client_max_body_size 16m;  # загрузка картинок в досье и раздаток (HANDOUT_MAX_UPLOAD_MB по умолчанию 15)

    # Браузер целый год ходит на сайт только по https (через http заголовок игнорируется, после certbot начинает действовать).
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
